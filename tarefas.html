const kv = (k, v) => v ? `<div><small>${esc(k)}</small><b>${esc(v)}</b></div>` : '';
function realcar(txt){ return esc(txt).replace(/@([a-z0-9._-]{2,40})/gi, (m, l) => `<span class="mencao" title="${esc(nomeDe(l.toLowerCase()))}">@${esc(l)}</span>`); }
function fTam(b){ b = Number(b) || 0; if (!b) return ''; if (b < 1024) return b + ' B'; if (b < 1048576) return (b / 1024).toFixed(0) + ' KB'; return (b / 1048576).toFixed(1) + ' MB'; }

function ligarGaveta(t){
  const pn = $('dw-pn');
  qsa('[data-fecha="dw"]', pn).forEach(b => b.onclick = fecharGaveta);
  const ed = $('dw-ed'); if (ed) ed.onclick = () => abrirForm(t);
  const ci = $('dw-ciente'); if (ci) ci.onclick = () => darCiencia(t.id, ci);
  qsa('[data-st]', pn).forEach(b => b.onclick = () => mudarStatus(t, b.dataset.st, b));
  qsa('[data-op]', pn).forEach(b => b.onclick = () => b.dataset.op === 'aprovar' ? aprovar(t, b) : devolver(t));
  const pr = $('dw-prog');
  if (pr){ let tm; pr.oninput = () => { pn.querySelector('.bloco h5 b').textContent = pr.value + '%'; pn.querySelector('.bloco .pb i').style.width = pr.value + '%'; clearTimeout(tm); tm = setTimeout(async () => { try { await acao(t.id, 'progresso', { valor:Number(pr.value) }); t.progresso = Number(pr.value); carregar(true); } catch(e){ toast(e.message, { cor:'#e66767' }); } }, 600); }; }
  qsa('[data-ck]', pn).forEach(l => l.addEventListener('click', async (e) => {
    if (e.target.closest('[data-ckdel]')) return;
    e.preventDefault();
    if (!(t.pode.gerir || t.pode.resp) || t.status === 'CONCLUIDA') return;
    l.classList.toggle('ok');
    const c = t.checklist.find(x => x.id === l.dataset.ck); if (c) c.ok = l.classList.contains('ok');
    const pct = Math.round(t.checklist.filter(x => x.ok).length / t.checklist.length * 100);
    pn.querySelector('.bloco h5 b').textContent = pct + '%'; pn.querySelector('.bloco .pb i').style.width = pct + '%';
    try { const r = await acao(t.id, 'check', { sub:'toggle', item:l.dataset.ck, ok: l.classList.contains('ok') }); t.progresso = r.progresso; if (r.progresso === 100) { confete(60); toast('Todas as etapas feitas! Conclua a tarefa quando quiser.', { cor:'#199e70', ic:'🎯' }); } recarregarDetalhe(true); carregar(true); }
    catch(err){ toast(err.message, { cor:'#e66767' }); recarregarDetalhe(true); }
  }));
  qsa('[data-ckdel]', pn).forEach(b => b.addEventListener('click', async (e) => { e.preventDefault(); e.stopPropagation(); try { await acao(t.id, 'check', { sub:'del', item:b.dataset.ckdel }); recarregarDetalhe(true); carregar(true); } catch(err){ toast(err.message, { cor:'#e66767' }); } }));
  const novo = $('ck-novo');
  const addCk = async () => { const v = novo.value.trim(); if (!v) return; novo.value = ''; try { await acao(t.id, 'check', { sub:'add', texto:v }); await recarregarDetalhe(true); carregar(true); setTimeout(() => $('ck-novo') && $('ck-novo').focus(), 50); } catch(err){ toast(err.message, { cor:'#e66767' }); } };
  if (novo){ novo.onkeydown = (e) => { if (e.key === 'Enter') addCk(); }; $('ck-add').onclick = addCk; }
  const fase = $('dw-fase'); if (fase) fase.onchange = async () => { try { await acao(t.id, 'fase', { fase: fase.value }); toast('⚖️ Fase atualizada.', { cor:'#e66767' }); recarregarDetalhe(true); carregar(true); } catch(e){ toast(e.message, { cor:'#e66767' }); } };
  const prr = $('dw-prorr'); if (prr) prr.onclick = () => prorrogar(t);
  const arq = $('dw-arq'); if (arq) arq.onclick = () => arquivar(t);
  qsa('[data-anx]', pn).forEach(b => b.onclick = () => baixarAnexo(b.dataset.anx, b.dataset.nome, b));
  let tipo = qsa('[data-cptipo].on', pn)[0].dataset.cptipo;
  qsa('[data-cptipo]', pn).forEach(b => b.onclick = () => { tipo = b.dataset.cptipo; qsa('[data-cptipo]', pn).forEach(x => x.classList.toggle('on', x === b)); });
  const arqIn = $('cp-arq');
  arqIn.onchange = () => { $('cp-arq-nome').textContent = arqIn.files[0] ? '📎 ' + arqIn.files[0].name : ''; };
  const txt = $('cp-txt');
  txt.oninput = () => { txt.style.height = 'auto'; txt.style.height = Math.min(160, txt.scrollHeight) + 'px'; };
  txt.onkeydown = (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('cp-env').click(); };
  $('cp-env').onclick = async () => {
    const f = arqIn.files[0];
    if (!txt.value.trim() && !f) return txt.focus();
    if (f && f.size > 15 * 1048576) return toast('Arquivo maior que 15 MB.', { cor:'#e66767' });
    const btn = $('cp-env'); btn.disabled = true; btn.textContent = f ? 'Enviando anexo…' : 'Enviando…';
    const fd = new FormData(); fd.append('tarefa_id', t.id); fd.append('texto', txt.value); fd.append('tipo', tipo); if (f) fd.append('arquivo', f);
    try { await apiForm('/api/tarefas/andamento', fd); txt.value = ''; arqIn.value = ''; $('cp-arq-nome').textContent = ''; await recarregarDetalhe(true); const tl = pn.querySelector('.tl'); if (tl) tl.lastElementChild && tl.lastElementChild.scrollIntoView({ behavior:'smooth', block:'center' }); carregar(true); }
    catch(e){ toast(e.message, { cor:'#e66767', ic:'⚠️' }); }
    finally { btn.disabled = false; btn.textContent = 'Enviar'; }
  };
}

async function baixarAnexo(url, nome, btn){
  const velho = btn.innerHTML; btn.innerHTML = '⏳ Abrindo…';
  try {
    const r = await fetch(API_BASE + url, { headers: cab() });
    if (!r.ok) throw new Error('Não consegui abrir o anexo (' + r.status + ').');
    const blob = await r.blob();
    const u = URL.createObjectURL(blob);
    const w = window.open(u, '_blank');
    if (!w){ const a = document.createElement('a'); a.href = u; a.download = nome || 'anexo'; a.click(); }
    setTimeout(() => URL.revokeObjectURL(u), 60000);
  } catch(e){ toast(e.message, { cor:'#e66767' }); }
  finally { btn.innerHTML = velho; }
}

async function darCiencia(id, btn){
  const t = D.tarefas.find(x => x.id === id); if (!t) return;
  if (btn){ btn.disabled = true; btn.innerHTML = '✔ Ciente!'; }
  try {
    await acao(id, 'ciente');
    t.ciencia[EU().login] = Object.assign({}, t.ciencia[EU().login], { ciente: new Date(agora()).toISOString() });
    toast(`✅ Ciência registrada — ${nomeDe(t.criado_por)} foi avisado.`, { cor:'#199e70' });
    confete(40);
    if (ABERTA === id) recarregarDetalhe(true);
    carregar(true); render();
  } catch(e){ toast(e.message, { cor:'#e66767' }); if (btn) btn.disabled = false; }
}
async function mudarStatus(t, st, btn){
  btn.disabled = true;
  try {
    const r = await acao(t.id, 'status', { status: st });
    if (r.validacao) toast(`🛡️ Enviada para validação de ${nomeDe(t.criado_por)}.`, { cor:'#9085e9' });
    else if (r.status === 'CONCLUIDA'){ confete(); toast(`🏁 Concluída: “${t.titulo}”`, { cor:'#199e70' }); }
    else toast(`🔄 ${STm[r.status].nome}`, { cor: STm[r.status].hex });
    if (r.proxima) toast('🔁 A próxima rodada desta tarefa já foi criada.', { cor:'#3987e5' });
    await carregar(true); recarregarDetalhe(true);
  } catch(e){ toast(e.message, { cor:'#e66767' }); btn.disabled = false; }
}
async function aprovar(t, btn){
  btn.disabled = true;
  try { const r = await acao(t.id, 'aprovar'); confete(); toast('✅ Validada e concluída.', { cor:'#199e70' }); if (r.proxima) toast('🔁 Próxima rodada criada.', { cor:'#3987e5' }); await carregar(true); recarregarDetalhe(true); }

  const podeSec = secoesQuePossoCriar();

  FORM = {
    ed, id: ed ? t.id : '', versao: ed ? t.versao : 0, status: pre.status || 'AFAZER',

  $('md-cx').innerHTML = `

    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const x = novas[novas.length - 1];
    const nt = new Notification(novas.length > 1 ? `${novas.length} novas na Central de Tarefas` : 'Central de Tarefas', { body: x.texto, icon:'LOGOS/bpfron_transp.png', tag:'tarefas-bpfron' });
    nt.onclick = () => { window.focus(); if (x.tarefa_id) abrirTarefa(x.tarefa_id); nt.close(); };
  } catch(e){}
}
$('bt-sino').addEventListener('click', (e) => { e.stopPropagation(); $('np').classList.contains('on') ? $('np').classList.remove('on') : abrirNotif(); });

function abrirNotif(){ $('np').classList.add('on'); renderNotif(); marcarLidas(); }
async function marcarLidas(){
  const n = D && D.notificacoes; if (!n || !n.nao_lidas) return;
  const ate = n.itens[0] && n.itens[0].quando;
  n.nao_lidas = 0; atualizarTitulo();
  try { const r = await apiPost('/api/tarefas/notif/lida', { ate }); n.lido_ate = r.lido_ate; } catch(e){}
}
function renderNotif(){
  const n = D.notificacoes;
  const perm = 'Notification' in window ? Notification.permission : 'denied';
  $('np').innerHTML = `<div class="nph"><b>🔔 Notificações</b><button class="linkbtn" id="np-som">${somLigado() ? '🔊 Som ligado' : '🔇 Som desligado'}</button></div>
    <div class="npl">${n.itens.length ? n.itens.map(x => `<div class="ni ${x.quando > (NOTIF_LIDO_ANTES || '') ? 'nova' : ''} ${x.nivel === 'alta' ? 'alta' : ''}" data-nt="${esc(x.tarefa_id)}">
      ${x.de ? av(x.de, '') : `<span class="av" style="background:#334155">${ICONE_NOTIF[x.tipo] || '🔔'}</span>`}<div class="tx">${esc(x.texto)}<small>${ICONE_NOTIF[x.tipo] || ''} ${esc(rel(x.quando))}</small></div></div>`).join('')
      : '<div class="vazio"><span class="big">🔕</span>Nenhuma notificação ainda.<br>Quando delegarem algo para você, aparece aqui.</div>'}</div>
    <div class="npf">${perm === 'default' ? '<button class="btn sm" id="np-perm">🖥️ Avisar também no computador</button>' : perm === 'granted' ? '<span style="font-size:12px;color:#6ee7b7">🖥️ Alerta no computador ligado</span>' : ''}<span style="flex:1"></span><span style="font-size:12px;color:var(--dim)">últimas ${n.itens.length}</span></div>`;
  qsa('[data-nt]', $('np')).forEach(el => el.onclick = () => { if (el.dataset.nt){ $('np').classList.remove('on'); abrirTarefa(el.dataset.nt); } });
  $('np-som').onclick = () => { lembrar('tar_som', somLigado() ? '0' : '1'); if (somLigado()) som(false); renderNotif(); };
  const pb = $('np-perm'); if (pb) pb.onclick = async () => { try { await Notification.requestPermission(); } catch(e){} renderNotif(); };
}
let NOTIF_LIDO_ANTES = '';
const _abrirNotif = abrirNotif;
abrirNotif = function(){ NOTIF_LIDO_ANTES = (D && D.notificacoes.lido_ate) || ''; _abrirNotif(); };

/* Alerta de prazo: uma vez por dia, por tarefa, ao abrir a página. */
function alertasDePrazo(){
  const chave = 'tar_alerta_' + diaRO();
  let ja = {}; try { ja = JSON.parse(lido(chave) || '{}'); } catch(e){}
  const mins = D.tarefas.filter(t => minha(t) && t.status !== 'CONCLUIDA' && t.ativo !== 'NAO');
  const avisar = mins.filter(t => { const pz = prazoInfo(t) || {}; return (pz.atrasada || pz.hoje) && !ja[t.id]; }).slice(0, 3);
  avisar.forEach((t, i) => { ja[t.id] = 1; const pz = prazoInfo(t); setTimeout(() => toast(`${pz.atrasada ? '⏰ Atrasada' : '⏳ Vence hoje'}: “${t.titulo}”`, { cor: pz.atrasada ? '#e66767' : '#d95926', fn: () => abrirTarefa(t.id), dur: 9000 }), 1400 + i * 500); });
  try { localStorage.setItem(chave, JSON.stringify(ja)); } catch(e){}
}

/* ---------- toast ---------- */
function toast(txt, o){
  o = o || {};
  const el = document.createElement('div');
  el.className = 'toast'; el.style.setProperty('--c', o.cor || '#F5C518');
  el.innerHTML = `${o.ic ? `<span>${o.ic}</span>` : ''}<span style="flex:1">${esc(txt)}</span><button class="x" aria-label="Fechar">✕</button>`;
  const fora = () => { el.classList.add('sai'); setTimeout(() => el.remove(), 350); };
  el.querySelector('.x').onclick = (e) => { e.stopPropagation(); fora(); };
  el.onclick = () => { if (o.fn) o.fn(); fora(); };
  $('toasts').appendChild(el);
  while ($('toasts').children.length > 5) $('toasts').firstChild.remove();
  setTimeout(fora, o.dur || 5000);
}

/* ---------- confete (conclusão) ---------- */
function confete(qtd){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('confete'), g = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cores = ['#F5C518','#199e70','#3987e5','#d95926','#9085e9','#e66767'];
  const ps = Array.from({ length: qtd || 140 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .45, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 5, r: Math.random() * 6 + 4, c: cores[Math.random() * cores.length | 0], a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
  const t0 = performance.now();
  const f = (t) => {
    g.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); });
    if (t - t0 < 2200) requestAnimationFrame(f); else g.clearRect(0, 0, cv.width, cv.height);
  };
  requestAnimationFrame(f);
}

}

function imprimirProc(lista){

    ${lista.map(t => { const e = t.extra || {}; const pz = prazoInfo(t); const fi = FASES.find(f => f.id === e.fase); return `<tr><td>${esc(nomeTipo(t))}${e.numero ? ' ' + esc(e.numero) : ''}${e.sei ? '<br>SEI ' + esc(e.sei) : ''}</td><td>${esc(t.titulo)}</td><td>${esc((t.responsaveis || []).map(nomeDe).join(', '))}</td><td>${esc(fData(e.instauracao, true))}</td><td>${esc(fData(t.prazo, true))}${pz && pz.atrasada ? ' ⚠ VENCIDO' : ''}</td><td>${(e.prorrogacoes || []).length || '—'}</td><td>${esc(fi ? fi.nome : '')}</td><td>${t.progresso}%</td><td>${esc(STm[t.status].nome)}</td></tr>`; }).join('')}
    </tbody></table><div class="ass">______________________________________<br>Chefe da Seção</div>`);

function imprimirPainel(secs, base){
  imprimir(cabecalhoRel('Resumo da chefia', FPN ? secaoDe(FPN).nome : 'seções acompanhadas') +
    `<table><thead><tr><th>Seção</th>${ST.map(s => `<th>${s.nome}</th>`).join('')}<th>Atrasadas</th><th>Total</th></tr></thead><tbody>
    ${(FPN ? secs.filter(s => s.id === FPN) : secs).map(s => { const ts = base.filter(t => t.secao === s.id); return `<tr><td>${esc(s.nome)}</td>${ST.map(x => `<td>${ts.filter(t => t.status === x.id).length}</td>`).join('')}<td>${ts.filter(t => t.status !== 'CONCLUIDA' && (prazoInfo(t) || {}).atrasada).length}</td><td>${ts.length}</td></tr>`; }).join('')}
    </tbody></table><h3 style="margin:16px 0 6px;font-size:12pt">Tarefas atrasadas</h3>
    <table><thead><tr><th>Nº</th><th>Tarefa</th><th>Seção</th><th>Responsáveis</th><th>Prazo</th><th>%</th></tr></thead><tbody>
    ${base.filter(t => t.status !== 'CONCLUIDA' && (prazoInfo(t) || {}).atrasada).map(t => `<tr><td>${t.num}</td><td>${esc(t.titulo)}</td><td>${esc(t.secao)}</td><td>${esc((t.responsaveis || []).map(nomeDe).join(', '))}</td><td>${esc(fData(t.prazo, true))}</td><td>${t.progresso}%</td></tr>`).join('') || '<tr><td colspan="6">Nenhuma.</td></tr>'}
    </tbody></table>`);
}

/* ============================== atalhos, busca, link ============================== */
$('busca').addEventListener('input', (e) => {
  F.busca = e.target.value;
  if (VIEW !== 'quadro' && VIEW !== 'calendario' && VIEW !== 'proc') VIEW = 'quadro';
  clearTimeout(window._tb); window._tb = setTimeout(() => { qsa('.nb').forEach(b => b.classList.toggle('on', b.dataset.v === VIEW)); render(); }, 180);
});
$('bt-novo').addEventListener('click', () => VIEW === 'proc' ? novoProc() : abrirForm());
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){
    if ($('md2').classList.contains('on')) return fecharMd2();
    if ($('md').classList.contains('on')) return fecharForm();
    if ($('np').classList.contains('on')) return $('np').classList.remove('on');
    if ($('dw').classList.contains('on')) return fecharGaveta();
  }
  const digitando = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (digitando || !D || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/'){ e.preventDefault(); $('busca').focus(); }
  if (e.key === 'n' || e.key === 'N'){ if (secoesQuePossoCriar().length){ e.preventDefault(); abrirForm(); } }
});
/* tarefas.html#t=ID abre a tarefa (link mandado por WhatsApp, por exemplo). */
function abrirPeloEndereco(){ const m = location.hash.match(/#t=([A-Z0-9]+)/i); if (m) abrirTarefa(m[1]); }
window.addEventListener('hashchange', () => { if (D) abrirPeloEndereco(); });

boot();
