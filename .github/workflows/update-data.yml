name: Atualizar dados BPFRON

on:
  schedule:
    - cron: '*/10 * * * *'   # A cada 10 minutos
  workflow_dispatch:        # Permite rodar manualmente pelo GitHub

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar a BASE no Worker (banco de apreensões)
        run: |
          # Desde 19/09/2026 a fonte é o BANCO NOVO, servido pelo Worker em
          # /api/base já nas 49 colunas de sempre (e sem PII). A planilha antiga
          # (chave "2PACX-1vSobDew…") virou arquivo de consulta e parou de ser
          # alimentada — buscar nela deixaria o data.csv congelado no dia da
          # migração, e ele é o fallback do site quando o Worker não responde.
          curl -fL --retry 3 --retry-delay 5 -o data.csv             "https://bpfron-api.bpfron.workers.dev/api/base"
          BYTES=$(wc -c < data.csv)
          FIRST=$(head -c 1 data.csv)
          echo "data.csv: ${BYTES} bytes"
          if [ "$FIRST" = "<" ] || [ "$FIRST" = "{" ]; then echo "ERRO: não veio CSV"; exit 1; fi
          if [ "$BYTES" -lt 500 ]; then echo "ERRO: data.csv muito pequeno"; exit 1; fi

      - name: Remover dados pessoais do data.csv público
        run: |
          python3 - <<'PY'
          import csv, io

          COLUNAS_PII = {"Descrição Resumida", "Destino dos Envolvidos", "Endereço"}

          with open("data.csv", newline="", encoding="utf-8") as f:
              linhas = list(csv.reader(f))

          if linhas:
              header = linhas[0]
              idxs = [i for i, h in enumerate(header) if h.strip() in COLUNAS_PII]
              for row in linhas[1:]:
                  for i in idxs:
                      if i < len(row):
                          row[i] = ""

          with open("data.csv", "w", newline="", encoding="utf-8") as f:
              csv.writer(f).writerows(linhas)
          PY

      - name: Salvar CSVs no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.csv
          if git diff --staged --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "dados: atualização automática $(date -u '+%d/%m/%Y %H:%M') UTC"
            git push
          fi
