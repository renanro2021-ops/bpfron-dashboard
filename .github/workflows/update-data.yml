name: Atualizar dados BPFRON

on:
  schedule:
    - cron: '0 9 * * *'   # Todo dia às 06:00 BRT (09:00 UTC)
  workflow_dispatch:        # Permite rodar manualmente pelo GitHub

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar CSV do Google Sheets
        run: |
          curl -L \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -o data.csv \
            "https://docs.google.com/spreadsheets/d/1qOuy4T6w5jNB4fqunE2w7Zk8kP_M5Fv6sQsztOpfDTs/export?format=csv&gid=992567398"

          BYTES=$(wc -c < data.csv)
          FIRST=$(head -c 1 data.csv)
          echo "Baixado: ${BYTES} bytes | Primeiro char: '${FIRST}'"
          echo "--- Primeiras 3 linhas ---"
          head -3 data.csv
          echo "--------------------------"

          if [ "$FIRST" = "<" ]; then
            echo "ERRO: Google retornou HTML em vez de CSV (planilha não está compartilhada publicamente?)"
            exit 1
          fi
          if [ "$BYTES" -lt 500 ]; then
            echo "ERRO: CSV muito pequeno ou vazio"
            exit 1
          fi

      - name: Salvar data.csv no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.csv
          if git diff --staged --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "dados: atualização automática $(date -u '+%d/%m/%Y %H:%M') UTC"
            git push
          fi
