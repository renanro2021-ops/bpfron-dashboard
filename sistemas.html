<!DOCTYPE html>
<html lang="pt-BR" data-bp-claro>
<head>
<meta charset="UTF-8">
<script src="bp-casca.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#060912">
<title>Sistemas · BPFRON/RO</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bp-ui.css">
<style>
/* sistemas.html — prefixo .sis- (o resto vem do bp-ui.css) */
.sis-atalhos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.sis-at{--c:var(--acc);position:relative;display:flex;flex-direction:column;gap:6px;padding:14px 14px 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);
  text-align:left;cursor:pointer;color:inherit;overflow:hidden;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s,background .25s;animation:bp-sobe .5s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms)}
.sis-at::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--c),transparent)}
.sis-at:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 50%,transparent);box-shadow:var(--sh2);background:var(--card-h)}
.sis-at.on{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent);background:var(--card-h)}
.sis-at .sg{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;line-height:1;color:var(--c)}
.sis-at b{font-size:13px;color:var(--t1);line-height:1.25}
.sis-at small{font-size:11.5px;color:var(--muted);font-weight:700}
.sis-at .ic{position:absolute;right:12px;top:12px;font-size:20px;opacity:.85}
.sis-at.vazio{opacity:.5}

.sis-barra{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:22px 0 4px}
.sis-barra .bp-in{flex:1;min-width:220px}
.sis-so{display:inline-flex;align-items:center;gap:8px;padding:0 14px;min-height:50px;border-radius:14px;border:1px solid var(--line2);background:var(--card);font-size:14px;font-weight:700;color:var(--t3);cursor:pointer;user-select:none}
.sis-so input{width:18px;height:18px;accent-color:var(--acc)}

.sis-sec{--c:var(--acc);margin-top:34px;scroll-margin-top:84px}
.sis-cab{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sis-cab .sg{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;font-family:'Rajdhani',sans-serif;font-size:21px;font-weight:700;color:var(--c);
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 28%,transparent),color-mix(in srgb,var(--c) 6%,transparent));border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.sis-cab h2{margin:0;font-family:'Rajdhani',sans-serif;font-size:24px;color:var(--t1);line-height:1.1}
.sis-cab small{display:block;color:var(--muted);font-size:13px}
.sis-cab .bp-sl{margin-left:auto}
.sis-cab::after{content:'';display:none}

.sis-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.sis-cd{--c:var(--acc);position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:inherit;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .25s var(--ease),border-color .25s,box-shadow .25s,background .25s;animation:bp-sobe .5s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}
.sis-cd:hover,.sis-cd:focus-visible{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 50%,transparent);box-shadow:var(--sh2);background:var(--card-h);outline:none}
.sis-cd .lin{display:flex;align-items:center;gap:12px}
.sis-cd .bp-tile{--c:inherit}
.sis-cd h3{margin:0;font-family:'Rajdhani',sans-serif;font-size:19px;color:var(--t1);line-height:1.15}
.sis-cd p{margin:0;flex:1;color:var(--muted);font-size:13.5px;line-height:1.55}
.sis-cd .ro{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sis-cd .seta{margin-left:auto;color:var(--c);font-weight:800;transition:transform .25s var(--ease)}
.sis-cd:hover .seta{transform:translateX(4px)}
.sis-cd.fora{opacity:.5}
.sis-cd.fora:hover{opacity:.85}
.sis-nada{margin-top:10px}

@media (max-width:760px){
  .sis-atalhos{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .sis-at{padding:11px 10px 10px}
  .sis-at .sg{font-size:23px}
  .sis-at b{font-size:12px}
  .sis-at .ic{display:none}
  .sis-grade{grid-template-columns:1fr}
  .sis-so{flex:1 1 100%;justify-content:center}
}
</style>
<script type="application/json" id="bp-novidades">[
  { "data": "2026-10-29", "titulo": "Sistemas separados por seção", "quem": "todos", "itens": [
    "Os sistemas agora ficam agrupados por seção: Comando, P1, P2, P3, P4, P5 e P6, além do bloco para todo o efetivo.",
    "Os atalhos no topo levam direto para a seção; a busca procura em todas.",
    "Com login, marque \"Só os liberados para mim\" para esconder o que o seu login não abre.",
    "O menu ☰ e o Portal da Gestão usam a mesma divisão."
  ] }
]</script>
</head>
<body class="bp-pg">
<div class="bp-fundo" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="bp-topo">
  <div class="bp-topo-in" data-bp-menu>
    <a class="bp-marca" href="index.html" title="Voltar ao dashboard">
      <img src="LOGOS/bpfron_transp.avif" alt="Brasão BPFRON">
      <span><small>BPFRON · Rondônia</small><b>Todos os Sistemas</b></span>
    </a>
    <div class="bp-topo-acoes">
      <button type="button" class="bp-btn ic sec" title="Novidades desta página" aria-label="Novidades desta página" onclick="if(window.BPCasca&&BPCasca.novidades)BPCasca.novidades.abrir()"><i data-ic="novidade"></i></button>
      <a class="bp-btn ic sec" href="index.html" title="Voltar ao dashboard" aria-label="Voltar ao dashboard"><i data-ic="grade"></i></a>
    </div>
  </div>
</header>

<main class="bp-wrap">
  <section class="bp-heroi">
    <div>
      <span class="bp-selo-tx"><b></b>Sistemas por seção</span>
      <h1>Tudo do <em>BPFRON</em> num lugar só</h1>
      <p id="sis-texto">Escolha a seção e abra o sistema. As páginas restritas pedem o login do dashboard ao entrar; o ☰ no alto abre esta lista de qualquer página.</p>
      <div class="bp-bts">
        <a class="bp-btn" id="sis-portal" href="gestao.html"><i data-ic="grade"></i><span id="sis-portal-tx">Portal da Gestão</span></a>
        <a class="bp-btn sec" href="index.html"><i data-ic="voltar"></i>Dashboard</a>
      </div>
    </div>
    <div class="bp-selo" aria-hidden="true"><i></i><i></i><i></i><img src="LOGOS/bpfron_transp.avif" alt=""></div>
  </section>

  <div class="sis-atalhos" id="sis-atalhos"></div>

  <div class="sis-barra">
    <div class="bp-in"><i data-ic="buscar"></i><input id="q" type="search" placeholder="Buscar sistema (nome, assunto ou seção)…" autocomplete="off" aria-label="Buscar sistema"></div>
    <label class="sis-so bp-esconde" id="sis-so-wrap"><input type="checkbox" id="sis-so"> Só os liberados para mim</label>
  </div>

  <div id="lista"></div>
  <div id="vazio" class="bp-vazio sis-nada bp-esconde">Nenhum sistema encontrado.</div>
</main>

<script>
/* A lista de sistemas é a do bp-casca.js (BPCasca.CATALOGO / GRUPOS), a mesma
   do Portal da Gestão e do menu ☰. Sistema novo = item no CATALOGO, com o
   grupo da seção (cmd, p1…p6, efetivo, admin). */
const C = window.BPCasca;
const $ = (id) => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function norm(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }

let SEL = '';   // seção escolhida nos atalhos ('' = todas)
try { $('sis-so').checked = localStorage.getItem('bp_sis_so') === '1'; } catch (e) {}

function chip(s, P){
  const pode = C.pode(s, P), pa = C.papel(s, P);
  if (s.acesso === 'pub') return '<span class="bp-sl ok">Aberto ao efetivo</span>';
  if (!P.logado) return '<span class="bp-sl pend">' + C.ic('cadeado') + 'Requer login</span>';
  if (pode) return '<span class="bp-sl info">' + C.ic('check') + (pa === 'gestor' ? 'Gestor' : pa === 'ver' ? 'Só ver' : 'Liberado') + '</span>';
  return '<span class="bp-sl">Sem acesso neste login</span>';
}

function render(){
  const P = C.perfil();
  const q = norm($('q').value.trim());
  const so = P.logado && $('sis-so').checked;
  $('sis-so-wrap').classList.toggle('bp-esconde', !P.logado);

  const base = C.CATALOGO.filter(s => s.id !== 'sistemas' && (!so || C.pode(s, P)));
  const daSec = (g) => base.filter(s => s.grupo === g.id);

  // atalhos das seções
  $('sis-atalhos').innerHTML = C.GRUPOS.map((g, n) => {
    const k = daSec(g).length;
    return '<button type="button" class="sis-at' + (SEL === g.id ? ' on' : '') + (k ? '' : ' vazio') + '" data-g="' + g.id + '" style="--c:' + g.cor + ';--i:' + n + '" title="' + esc(g.desc || g.nome) + '">'
      + '<span class="ic" aria-hidden="true">' + g.ic + '</span><span class="sg">' + esc(g.sigla || g.nome) + '</span>'
      + '<b>' + esc(g.nome.replace(/^P\d · /, '')) + '</b><small>' + k + (k === 1 ? ' sistema' : ' sistemas') + '</small></button>';
  }).join('');

  let html = '', total = 0, n = 0;
  C.GRUPOS.forEach(g => {
    if (SEL && SEL !== g.id) return;
    const itens = daSec(g).filter(s => !q || norm(s.nome + ' ' + s.desc + ' ' + g.nome + ' ' + (g.sigla || '')).includes(q));
    if (!itens.length) return;
    total += itens.length;
    html += '<section class="sis-sec" id="sec-' + g.id + '" style="--c:' + g.cor + '">'
      + '<div class="sis-cab"><span class="sg">' + esc(g.sigla || g.ic) + '</span><div><h2>' + esc(g.nome) + '</h2><small>' + esc(g.desc || '') + '</small></div>'
      + '<span class="bp-sl">' + itens.length + '</span></div><div class="sis-grade">'
      + itens.map(s => {
          const fora = P.logado && !C.pode(s, P);
          return '<a class="sis-cd' + (fora ? ' fora' : '') + '" href="' + esc(C.hrefCom(s.href)) + '" style="--c:' + g.cor + ';--i:' + (n++) + '">'
            + '<div class="lin"><span class="bp-tile" style="--c:' + g.cor + '">' + s.ic + '</span><h3>' + esc(s.nome) + '</h3></div>'
            + '<p>' + esc(s.desc) + '</p>'
            + '<div class="ro">' + chip(s, P) + '<span class="seta" aria-hidden="true">→</span></div></a>';
        }).join('')
      + '</div></section>';
  });
  $('lista').innerHTML = html;
  $('vazio').classList.toggle('bp-esconde', total > 0);
  $('vazio').textContent = so && !q ? 'Nenhum sistema desta seção está liberado para o seu login.' : 'Nenhum sistema encontrado.';

  $('sis-portal').href = C.hrefCom(C.PORTAL.href);
  $('sis-portal-tx').textContent = P.logado ? 'Meu Portal da Gestão' : 'Entrar no Portal da Gestão';
  $('sis-texto').textContent = P.logado
    ? 'Você está como ' + P.nome + '. Os sistemas estão separados por seção; os que aparecem apagados não estão liberados para este login.'
    : 'Escolha a seção e abra o sistema. As páginas restritas pedem o login do dashboard ao entrar; o ☰ no alto abre esta lista de qualquer página.';
}

$('sis-atalhos').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-g]'); if (!b) return;
  SEL = SEL === b.dataset.g ? '' : b.dataset.g;
  render();
  const alvo = SEL ? $('sec-' + SEL) : $('lista');
  if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
$('q').addEventListener('input', () => { if ($('q').value.trim()) SEL = ''; render(); });
$('sis-so').addEventListener('change', () => { try { localStorage.setItem('bp_sis_so', $('sis-so').checked ? '1' : '0'); } catch (e) {} render(); });
C.aoMudarPerfil(render);
render();
</script>
</body>
</html>
